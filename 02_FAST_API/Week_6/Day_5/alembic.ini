
# A generic, single database configuration.

[alembic]

# Path to migration scripts
script_location = %(here)s/alembic

# Python import path
prepend_sys_path = .

# Path separator
path_separator = os

# Database URL
# Actual URL will be configured through database.py and env.py
sqlalchemy.url = postgresql+psycopg://

# Migration file encoding
output_encoding = utf-8


[post_write_hooks]


# Logging configuration

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
